<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>麻雀精算管理システム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --main-bg: #f0f2f5; --card-bg: #ffffff; --text: #333; --accent: #007bff; --border: #ddd; --hint: #777; }
        body { font-family: sans-serif; background: var(--main-bg); color: var(--text); margin: 0; padding: 10px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; max-width: 500px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { font-size: 1.1em; margin: 0 0 15px 0; text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab { flex: 1; text-align: center; padding: 10px; background: #eee; cursor: pointer; border-radius: 6px; font-weight: bold; color: #666; font-size: 0.85em; }
        .tab.active { background: var(--accent); color: white; }

        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .config-item { display: flex; flex-direction: column; }
        .config-item label { font-size: 0.7em; font-weight: bold; margin-bottom: 1px; color: #555; }
        .hint-text { font-size: 0.6em; color: var(--hint); margin-bottom: 4px; line-height: 1.2; }
        input, select { padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: var(--card-bg); color: var(--text); height: 40px; box-sizing: border-box; }
        .sub-input { margin-top: 4px; border-color: var(--accent); background: #f0f7ff; }

        .player-row { display: grid; grid-template-columns: 40px 1.2fr 1fr 1fr; gap: 5px; margin-bottom: 8px; align-items: center; }
        .sort-btn-group { display: flex; flex-direction: column; }
        .sort-btn { font-size: 10px; height: 18px; cursor: pointer; border: 1px solid var(--border); background: #f8f9fa; }
        .input-group { display: flex; align-items: center; }
        .sign-btn { width: 34px; height: 40px; border: 1px solid var(--border); border-radius: 6px 0 0 6px; font-weight: bold; cursor: pointer; }
        .sign-btn.plus { background: #e7f3ff; color: #007bff; }
        .sign-btn.minus { background: #fff0f0; color: #dc3545; }
        .player-row input { border-radius: 0 6px 6px 0; border-left: none; text-align: center; width: 100%; }

        .btn-main { background: #28a745; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-size: 1em; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #scoreTable { width: 100%; font-size: 0.75em; border-collapse: collapse; margin-top: 15px; background: #fff; }
        #scoreTable th, #scoreTable td { border: 1px solid var(--border); padding: 6px 4px; text-align: center; }
        #scoreTable th { background: #f8f9fa; }
        .hidden { display: none !important; }
        .result-box { margin-top: 15px; padding: 12px; background: #fff9db; border: 1px solid #fab005; border-radius: 8px; }
        pre { white-space: pre-wrap; font-size: 0.85em; margin: 0; color: #333; line-height: 1.5; font-family: monospace; }
    </style>
</head>
<body>
<div class="card">
    <h2>麻雀精算管理システム</h2>

    <div class="tabs">
        <div class="tab active" id="tab-direct" onclick="switchMode('direct')">直接入力</div>
        <div class="tab" id="tab-record" onclick="switchMode('record')">戦績記録</div>
    </div>

    <div class="config-grid">
        <div class="config-item">
            <label>パスコード</label>
            <div class="hint-text">設定の保存・呼出用</div>
            <div style="display:flex; gap:2px;">
                <input type="password" id="passCode" placeholder="4桁" oninput="loadPreset()" style="width:70%">
                <button onclick="savePreset()" style="font-size:10px; flex:1;">保存</button>
            </div>
        </div>
        <div class="config-item">
            <label>場代合計(円)</label>
            <div class="hint-text">お店に支払う総額</div>
            <input type="number" id="tableFee" value="5000">
        </div>
        
        <div class="config-item">
            <label>レート</label>
            <div class="hint-text">1ptあたりの金額</div>
            <select id="rateSelect" onchange="toggleFreeInput('rateSelect', 'rateInput')">
                <option value="50">50円</option><option value="100" selected>100円</option><option value="500">500円</option><option value="1000">1000円</option><option value="free">自由入力</option>
            </select>
            <input type="number" id="rateInput" value="100" class="sub-input hidden">
        </div>

        <div class="config-item">
            <label>チップ1枚</label>
            <div class="hint-text">1枚あたりの金額</div>
            <select id="chipSelect" onchange="toggleFreeInput('chipSelect', 'chipInput')">
                <option value="100">100円</option><option value="300">300円</option><option value="500" selected>500円</option><option value="1000">1000円</option><option value="free">自由入力</option>
            </select>
            <input type="number" id="chipInput" value="500" class="sub-input hidden">
        </div>

        <div class="config-item">
            <label>精算単位</label>
            <div class="hint-text">受け渡しの最小単位</div>
            <select id="unitSelect" onchange="toggleFreeInput('unitSelect', 'unitInput')">
                <option value="100">100円</option><option value="500">500円</option><option value="1000" selected>1000円</option><option value="free">自由入力</option>
            </select>
            <input type="number" id="unitInput" value="1000" class="sub-input hidden">
        </div>

        <div class="config-item">
            <label>場代の分配</label>
            <div class="hint-text">トップ・浮き組で負担</div>
            <select id="feeType">
                <option value="slope">傾斜分配</option><option value="equal">均等配分</option>
            </select>
        </div>

        <div class="config-item">
            <label>免除ライン</label>
            <div class="hint-text">これ以下は場代0円</div>
            <input type="number" id="exemptLimit" value="100" placeholder="例:100">
        </div>
        <div class="config-item">
            <label>人数</label>
            <div class="hint-text">対局人数</div>
            <input type="number" id="memberCount" value="4" onchange="initRows()">
        </div>
    </div>

    <div id="playerList"></div>
    
    <div id="recordBtns" class="hidden">
        <div id="suggestion" style="background:#e7f3ff; padding:10px; border-radius:8px; font-size:0.8em; margin:10px 0; text-align:center; cursor:pointer; color:#0056b3; border:1px solid #b3d7ff" onclick="applySug()"></div>
        <button class="btn-main" style="background:#007bff" onclick="addRound()">対局スコアを記録</button>
        <div style="overflow-x:auto"><table id="scoreTable"><thead><tr id="tableHeader"></tr></thead><tbody id="tableBody"></tbody></table></div>
        <button onclick="resetRounds()" style="width:100%; margin-top:10px; font-size:11px; color:#999; background:none; border:none; text-decoration:underline; cursor:pointer">全戦績削除</button>
    </div>

    <button class="btn-main" onclick="calculate()" style="background:#333; height:50px; margin-top:15px;">最終精算を実行</button>

    <div id="shareArea" class="hidden" style="margin-top:15px; border-top:1px solid #ccc; padding-top:15px">
        <div id="result-capture" class="result-box"><pre id="result-text"></pre></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px">
            <button onclick="shareLine()" style="background:#06C755; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer">LINE</button>
            <button onclick="saveImage()" style="background:#555; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer">画像保存</button>
        </div>
    </div>
</div>

<script>
let currentMode = 'direct';
let playerHistory = []; 
let lastSug = 0;

window.onload = () => { initRows(); };

function toggleFreeInput(selId, inpId) {
    const sel = document.getElementById(selId);
    const inp = document.getElementById(inpId);
    if(sel.value === 'free') { inp.classList.remove('hidden'); }
    else { inp.classList.add('hidden'); inp.value = sel.value; }
}

function switchMode(mode) {
    currentMode = mode;
    document.getElementById('tab-direct').className = mode === 'direct' ? 'tab active' : 'tab';
    document.getElementById('tab-record').className = mode === 'record' ? 'tab active' : 'tab';
    document.getElementById('recordBtns').classList.toggle('hidden', mode === 'direct');
    updateTableHeader(); updateTable();
}

function initRows() {
    const count = parseInt(document.getElementById('memberCount').value) || 4;
    const container = document.getElementById('playerList');
    container.innerHTML = '<div style="display:grid; grid-template-columns:40px 1.2fr 1fr 1fr; font-size:0.7em; color:#666; text-align:center; margin-bottom:5px;"><span>順入</span><span>名前</span><span>スコア</span><span>チップ</span></div>';
    playerHistory = Array.from({length: count}, () => []);
    for (let i=0; i<count; i++) {
        container.innerHTML += `<div class="player-row" data-id="${i}">
            <div class="sort-btn-group"><button class="sort-btn" onclick="move(this,-1)">▲</button><button class="sort-btn" onclick="move(this,1)">▼</button></div>
            <input type="text" class="p-name" value="プレイヤー${i+1}" oninput="updateTableHeader(); updateTable();">
            <div class="input-group"><button class="sign-btn plus" onclick="tglSign(this)">+</button><input type="number" class="p-score" oninput="checkSug()" placeholder="0" inputmode="decimal"></div>
            <div class="input-group"><button class="sign-btn plus" onclick="tglSign(this)">+</button><input type="number" class="p-chip" placeholder="0" inputmode="numeric"></div>
        </div>`;
    }
    updateTableHeader();
}

function tglSign(b) { b.innerText = b.innerText === "+" ? "-" : "+"; b.className = b.innerText === "+" ? "sign-btn plus" : "sign-btn minus"; checkSug(); }
function getV(el) { return (parseFloat(el.value)||0) * (el.previousElementSibling.innerText==="-" ? -1 : 1); }

function checkSug() {
    if (currentMode !== 'record') return;
    const scores = Array.from(document.querySelectorAll('.p-score'));
    const filled = scores.filter(e => e.value !== "");
    if (filled.length === scores.length - 1) {
        let sum = 0; scores.forEach(e => sum += getV(e));
        lastSug = -sum;
        document.getElementById('suggestion').innerHTML = `💡 残り： <b>${lastSug > 0 ? '+' : ''}${lastSug}</b> (適用)`;
        document.getElementById('suggestion').style.display = 'block';
    } else { document.getElementById('suggestion').style.display='none'; }
}

function applySug() {
    document.querySelectorAll('.p-score').forEach(el => {
        if (el.value === "") { el.value = Math.abs(lastSug); el.previousElementSibling.innerText = lastSug < 0 ? "-" : "+"; el.previousElementSibling.className = lastSug < 0 ? "sign-btn minus" : "sign-btn plus"; }
    });
    checkSug();
}

function addRound() {
    const rows = document.querySelectorAll('.player-row');
    const scores = Array.from(rows).map(row => getV(row.querySelector('.p-score')));
    rows.forEach((row, i) => playerHistory[row.getAttribute('data-id')].push(scores[i]));
    updateTable();
    document.querySelectorAll('.p-score').forEach(el => el.value = "");
    checkSug();
}

function move(btn, dir) {
    const row = btn.closest('.player-row');
    const rows = Array.from(document.querySelectorAll('.player-row'));
    const idx = rows.indexOf(row);
    if (dir === -1 && idx > 0) row.parentNode.insertBefore(row, rows[idx-1]);
    else if (dir === 1 && idx < rows.length - 1) row.parentNode.insertBefore(rows[idx+1], row);
    updateTableHeader(); updateTable();
}

function updateTableHeader() {
    const rows = document.querySelectorAll('.player-row');
    const tableHeader = document.getElementById('tableHeader');
    let html = '<th>回</th>';
    rows.forEach(row => {
        const name = row.querySelector('.p-name').value;
        html += `<th>${name.substring(0,3)}</th>`;
    });
    tableHeader.innerHTML = html;
}

function updateTable() {
    const rows = document.querySelectorAll('.player-row');
    const body = document.getElementById('tableBody');
    body.innerHTML = "";
    const roundCount = playerHistory[0] ? playerHistory[0].length : 0;
    for (let r = 0; r < roundCount; r++) {
        let rowHtml = `<td>${r+1}</td>`;
        rows.forEach(row => {
            const s = playerHistory[row.getAttribute('data-id')][r];
            rowHtml += `<td>${s > 0 ? '+' : ''}${s}</td>`;
        });
        body.innerHTML += `<tr>${rowHtml}</tr>`;
    }
    if (roundCount > 0) {
        let footerHtml = `<tr style="font-weight:bold; background:#eef; color:#0056b3;"><td>計</td>`;
        rows.forEach(row => {
            const sum = playerHistory[row.getAttribute('data-id')].reduce((a, b) => a + b, 0);
            footerHtml += `<td>${sum > 0 ? '+' : ''}${sum}</td>`;
        });
        body.innerHTML += footerHtml + `</tr>`;
    }
}

function calculate() {
    const rate = parseInt(document.getElementById('rateInput').value);
    const chipRate = parseInt(document.getElementById('chipInput').value);
    const tableFee = parseInt(document.getElementById('tableFee').value);
    const unit = parseInt(document.getElementById('unitInput').value);
    const exemptPoint = Math.abs(parseInt(document.getElementById('exemptLimit').value));
    const feeType = document.getElementById('feeType').value;
    
    const rows = document.querySelectorAll('.player-row');
    let results = Array.from(rows).map(row => {
        const id = row.getAttribute('data-id');
        const name = row.querySelector('.p-name').value;
        const totalScore = (currentMode === 'record') ? playerHistory[id].reduce((a,b)=>a+b, 0) : getV(row.querySelector('.p-score'));
        const chipCount = getV(row.querySelector('.p-chip'));
        let gameInc = totalScore * rate;
        let rawSum = gameInc + (chipCount * chipRate);
        return { name, totalScore, gameInc, rawSum, finalHand: 0, fee: 0, isExempt: false, power: 0 };
    });

    // 1. 端数調整
    let fAdjustment = 0;
    results.forEach(p => {
        let rounded = (p.rawSum < 0) ? Math.ceil(p.rawSum / unit) * unit : Math.floor(p.rawSum / unit) * unit;
        fAdjustment += (p.rawSum - rounded);
        p.finalHand = rounded;
    });
    const topIdx = results.reduce((best, cur, idx, arr) => cur.totalScore > arr[best].totalScore ? idx : best, 0);
    results[topIdx].finalHand += Math.round(fAdjustment);

    // 2. 場代精算（免除ラインを底とした傾斜分配）
    if (feeType === 'equal') {
        const perPerson = Math.floor((tableFee / results.length) / unit) * unit;
        results.forEach(p => p.fee = perPerson);
        results[topIdx].fee += (tableFee - (perPerson * results.length));
    } else {
        const baseLine = -exemptPoint;
        let totalPower = 0;
        
        results.forEach((p, idx) => {
            p.isExempt = (p.totalScore <= baseLine);
            if (!p.isExempt) {
                // 免除ラインからの浮き幅を負担パワーとする
                p.power = p.totalScore - baseLine; 
                totalPower += p.power;
            }
        });

        let allocatedFeeSum = 0;
        if (totalPower > 0) {
            results.forEach((p, idx) => {
                if (idx !== topIdx && !p.isExempt) {
                    // 他のプレイヤーにパワーに応じた場代を割り振る
                    p.fee = Math.floor((tableFee * (p.power / totalPower)) / unit) * unit;
                    allocatedFeeSum += p.fee;
                }
            });
            // 残りをすべてトップが負担
            results[topIdx].fee = tableFee - allocatedFeeSum;
        } else {
            results[topIdx].fee = tableFee;
        }
    }

    let txt = `【精算リザルト】\n━━━━━━━━━━━━━━\n`;
    txt += `◆最終 Pt収支\n`;
    results.forEach(p => txt += `${p.name}: ${p.totalScore > 0 ? '+' : ''}${p.totalScore} pt\n`);
    txt += `\n◆受け渡し額 (個人間)\n`;
    results.forEach(p => txt += `${p.name}: ${p.finalHand > 0 ? '+' : ''}${p.finalHand.toLocaleString()} 円\n`);
    txt += `\n◆場代支払い (お店へ)\n`;
    results.forEach(p => txt += `${p.name}: ${p.fee.toLocaleString()} 円 ${p.isExempt ? '※免除' : ''}\n`);
    txt += `\n◆実質収支 (場代込合計)\n`;
    results.forEach(p => {
        const total = p.finalHand - p.fee;
        txt += `${p.name}: ${total > 0 ? '+' : ''}${total.toLocaleString()} 円\n`;
    });
    txt += `━━━━━━━━━━━━━━\nレート:${rate}円/精算単位:${unit}円\n免除ライン:-${exemptPoint}pt`;
    
    document.getElementById('result-text').innerText = txt;
    document.getElementById('shareArea').classList.remove('hidden');
}

function savePreset() {
    const code = document.getElementById('passCode').value;
    if(!code) return alert("パスコードを入力してください");
    const names = Array.from(document.querySelectorAll('.p-name')).map(n=>n.value);
    let ps = JSON.parse(localStorage.getItem('mj_final_std_presets') || "{}");
    ps[code] = { 
        names, fee: document.getElementById('tableFee').value, 
        rate: document.getElementById('rateInput').value,
        chip: document.getElementById('chipInput').value,
        unit: document.getElementById('unitInput').value,
        count: document.getElementById('memberCount').value,
        exempt: document.getElementById('exemptLimit').value
    };
    localStorage.setItem('mj_final_std_presets', JSON.stringify(ps));
    alert("設定を保存しました。");
}

function loadPreset() {
    const code = document.getElementById('passCode').value;
    const ps = JSON.parse(localStorage.getItem('mj_final_std_presets') || "{}");
    if (ps[code]) {
        document.getElementById('tableFee').value = ps[code].fee;
        document.getElementById('rateInput').value = ps[code].rate;
        document.getElementById('chipInput').value = ps[code].chip;
        document.getElementById('unitInput').value = ps[code].unit;
        document.getElementById('memberCount').value = ps[code].count || 4;
        document.getElementById('exemptLimit').value = ps[code].exempt || 100;
        initRows();
        setTimeout(() => {
            const inputs = document.querySelectorAll('.p-name');
            ps[code].names.forEach((n, i) => { if(inputs[i]) inputs[i].value = n; });
            updateTableHeader(); updateTable();
            document.getElementById('passCode').style.background = "#d3f9d8";
        }, 50);
    }
}

function resetRounds() { if(confirm("戦績をすべて削除しますか？")) { playerHistory.forEach(h => h.length = 0); updateTable(); } }
function shareLine() { window.open(`https://line.me/R/msg/text/?${encodeURIComponent(document.getElementById('result-text').innerText)}`, '_blank'); }
function saveImage() { html2canvas(document.querySelector("#result-capture")).then(c => { const l=document.createElement('a'); l.download='mj_result.png'; l.href=c.toDataURL(); l.click(); }); }
</script>
</body>
</html>
