<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻雀精算ツール V7</title>
    <style>
        :root { --line-color: #06C755; --primary-color: #2c3e50; --error-color: #e74c3c; }
        body { font-family: sans-serif; padding: 10px; background: #f4f7f6; color: #333; margin: 0; min-height: 100vh; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h2 { text-align: center; color: var(--primary-color); margin: 0 0 15px 0; font-size: 1.2em; }
        .config-section { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); }
        .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        label { font-size: 0.85em; font-weight: bold; min-width: 80px; }
        input, select { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        .player-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 5px; margin-bottom: 5px; }
        .player-header { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 5px; font-size: 0.75em; font-weight: bold; color: #666; margin-bottom: 3px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        .btn-calc { background-color: var(--primary-color); color: white; }
        .btn-line { background-color: var(--line-color); color: white; display: none; }
        #suggestion { background: #e3f2fd; padding: 8px; border-radius: 5px; font-size: 0.85em; margin-bottom: 10px; border: 1px dashed #2196f3; cursor: pointer; display: none; text-align: center; }
        #result { margin-top: 15px; padding: 12px; background: #fffde7; border: 1px solid #ffd54f; border-radius: 8px; white-space: pre-wrap; font-family: monospace; font-size: 0.85em; line-height: 1.5; }
        .hidden { display: none !important; }
        .alert { color: var(--error-color); font-weight: bold; font-size: 0.8em; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🀄 麻雀精算ツール V7</h2>
    
    <div class="config-section">
        <div class="row">
            <label>人数</label>
            <select id="memberCount" onchange="updatePlayerRows()">
                <option value="3">3人</option><option value="4" selected>4人</option>
                <option value="5">5人</option><option value="6">6人</option>
            </select>
        </div>
        <div class="row">
            <label>レート</label>
            <select id="rateSelect" onchange="toggleInput('rate')">
                <option value="50">1pt = 50円</option><option value="100">1pt = 100円</option><option value="custom">自由入力</option>
            </select>
            <input type="number" id="customRate" class="hidden" placeholder="円" value="50">
        </div>
        <div class="row">
            <label>チップ/枚</label>
            <select id="chipSelect" onchange="toggleInput('chip')">
                <option value="50">50円</option><option value="100" selected>100円</option><option value="300">300円</option>
                <option value="500">500円</option><option value="1000">1000円</option><option value="custom">自由入力</option>
            </select>
            <input type="number" id="customChip" class="hidden" placeholder="円" value="100">
        </div>
        <div class="row">
            <label>場代合計</label>
            <input type="number" id="tableFee" value="2000"><span>円</span>
        </div>
    </div>

    <div id="suggestion" onclick="applySuggestion()"></div>

    <div class="player-header"><span>名前</span><span>スコア(pt)</span><span>チップ(枚)</span></div>
    <div id="playerList"></div>

    <button class="btn-calc" onclick="calculate()">計算実行</button>
    <div id="result" style="display:none;"></div>
    <button id="lineBtn" class="btn-line" onclick="shareLine()">LINEに送信</button>
</div>

<script>
window.onload = updatePlayerRows;

function toggleInput(type) {
    const isRate = type === 'rate';
    const select = document.getElementById(isRate ? 'rateSelect' : 'chipSelect');
    const input = document.getElementById(isRate ? 'customRate' : 'customChip');
    input.classList.toggle('hidden', select.value !== 'custom');
}

function updatePlayerRows() {
    const count = document.getElementById('memberCount').value;
    const container = document.getElementById('playerList');
    container.innerHTML = '';
    const alphabet = "ABCDEF";
    for (let i = 0; i < count; i++) {
        container.innerHTML += `
            <div class="player-row">
                <input type="text" class="p-name" value="プレイヤー${alphabet[i]}">
                <input type="number" class="p-score" oninput="checkSuggestion()" placeholder="pt">
                <input type="number" class="p-chip" oninput="checkSuggestion()" placeholder="枚">
            </div>`;
    }
}

let lastSuggestion = { score: 0, chip: 0 };

function checkSuggestion() {
    const count = parseInt(document.getElementById('memberCount').value);
    const scoreInputs = Array.from(document.querySelectorAll('.p-score'));
    const chipInputs = Array.from(document.querySelectorAll('.p-chip'));
    
    const filledScores = scoreInputs.filter(el => el.value !== "");
    const filledChips = chipInputs.filter(el => el.value !== "");

    if (filledScores.length === count - 1 || filledChips.length === count - 1) {
        const sumScore = scoreInputs.reduce((a, b) => a + (parseFloat(b.value) || 0), 0);
        const sumChip = chipInputs.reduce((a, b) => a + (parseFloat(b.value) || 0), 0);
        lastSuggestion.score = -sumScore;
        lastSuggestion.chip = -sumChip;
        
        const sugDiv = document.getElementById('suggestion');
        sugDiv.innerHTML = `💡 残り： <b>${lastSuggestion.score}pt / チップ${lastSuggestion.chip}枚</b> 入力`;
        sugDiv.style.display = 'block';
    } else {
        document.getElementById('suggestion').style.display = 'none';
    }
}

function applySuggestion() {
    document.querySelectorAll('.p-score').forEach(el => { if(el.value === "") el.value = lastSuggestion.score; });
    document.querySelectorAll('.p-chip').forEach(el => { if(el.value === "") el.value = lastSuggestion.chip; });
    document.getElementById('suggestion').style.display = 'none';
}

function calculate() {
    const rate = document.getElementById('rateSelect').value === 'custom' ? parseFloat(document.getElementById('customRate').value) : parseFloat(document.getElementById('rateSelect').value);
    const chipRate = document.getElementById('chipSelect').value === 'custom' ? parseFloat(document.getElementById('customChip').value) : parseFloat(document.getElementById('chipSelect').value);
    const totalTableFee = parseFloat(document.getElementById('tableFee').value) || 0;
    const count = parseInt(document.getElementById('memberCount').value);
    const limit = rate >= 100 ? -10000 : -5000;
    
    const names = document.querySelectorAll('.p-name');
    const scores = document.querySelectorAll('.p-score');
    const chips = document.querySelectorAll('.p-chip');
    
    let players = [];
    let totalScore = 0;
    let totalChip = 0;

    for (let i = 0; i < count; i++) {
        const s = parseFloat(scores[i].value) || 0;
        const c = parseFloat(chips[i].value) || 0;
        totalScore += s;
        totalChip += c;
        players.push({ name: names[i].value, score: s, chip: c, gameInc: s * rate, chipInc: c * chipRate, fee: 0, final: 0, isExempt: false });
    }

    if (Math.abs(totalScore) > 0.01 || Math.abs(totalChip) > 0.01) {
        alert(`合計が合いません！\nスコア計: ${totalScore} / チップ計: ${totalChip}`);
    }

    // 場代傾斜計算
    let activeSum = 0;
    players.forEach(p => {
        if (p.gameInc <= limit) p.isExempt = true;
        else activeSum += (p.gameInc + 50000);
    });
    if (activeSum > 0) {
        players.forEach(p => { if (!p.isExempt) p.fee = totalTableFee * ((p.gameInc + 50000) / activeSum); });
    }

    // 端数処理（トップ負担）
    let fractionSum = 0;
    players.forEach(p => {
        const raw = p.gameInc + p.chipInc - p.fee;
        p.final = Math.floor(raw / 100) * 100;
        fractionSum += (raw - p.final);
    });
    const top = players.reduce((a, b) => a.score > b.score ? a : b);
    top.final += Math.round(fractionSum);

    // 結果出力
    let txt = `【麻雀精算結果】\n`;
    players.forEach(p => {
        txt += `------------------\n`;
        txt += `${p.name}: ${p.final.toLocaleString()}円\n`;
        txt += ` (スコア:${p.score}pt/${(p.gameInc).toLocaleString()} / チップ:${p.chip}枚/${(p.chipInc).toLocaleString()} / 場代:-${Math.round(p.fee).toLocaleString()})\n`;
        if(p.isExempt) txt += ` ※場代免除対象\n`;
    });
    if (Math.abs(totalScore) > 0.01) txt += `\n⚠️スコア不整合(${totalScore}pt)`;
    if (Math.abs(totalChip) > 0.01) txt += `\n⚠️チップ不整合(${totalChip}枚)`;

    const resDiv = document.getElementById('result');
    resDiv.innerText = txt;
    resDiv.style.display = 'block';
    document.getElementById('lineBtn').style.display = 'block';
}

function shareLine() {
    window.open(`https://line.me/R/msg/text/?${encodeURIComponent(document.getElementById('result').innerText)}`, '_blank');
}
</script>
</body>
</html>
